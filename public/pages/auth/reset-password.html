<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quantum | Reset Password</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, sans-serif; background: #ffffff; }
.page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
}
.card {
  width: min(360px, 100%);
  background: #dff3ff;
  border-radius: 30px;
  padding: 32px 28px;
  text-align: center;
  box-shadow: 0 18px 35px rgba(0,0,0,.25);
}
.logo {
  width: 78px;
  height: 78px;
  margin: 0 auto 18px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
.title { font-size: 24px; color: #063047; margin: 0 0 8px; }
.subtitle { font-size: 14px; color: #607d8b; margin: 0 0 22px; line-height: 1.35; }
.field { text-align: left; margin-bottom: 18px; }
.field label { display: block; margin-bottom: 7px; font-size: 15px; font-weight: 600; color: #263238; }
.field input {
  width: 100%;
  height: 46px;
  border: none;
  outline: none;
  border-radius: 14px;
  padding: 0 16px;
  font-size: 15px;
  color: #555;
  background: #fff;
  box-shadow: 8px 8px 12px rgba(0,0,0,.20);
}
.field input:focus { border: 2px solid #008fa3; }
.btn {
  width: 160px;
  height: 46px;
  border: none;
  border-radius: 13px;
  background: linear-gradient(135deg, #006b80, #00a99d);
  color: #fff;
  font-size: 19px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 10px;
  box-shadow: 6px 8px 14px rgba(0,0,0,.30);
}
.btn:hover { transform: translateY(-1px); }
.note {
  margin-top: 14px;
  font-size: 13px;
  color: #35556a;
  line-height: 1.45;
  min-height: 20px;
}
.note.ok { color: #0a6b3a; }
.note.err { color: #b42318; }
.links {
  margin-top: 14px;
  display: flex;
  justify-content: center;
  gap: 14px;
  flex-wrap: wrap;
  font-size: 13px;
}
.links a { color: #4f4f4f; text-decoration: underline; }
@media (max-width: 720px) {
  .page { padding: .75rem; }
  .card {
    width: min(92vw, 360px);
    padding: clamp(24px, 6vw, 34px) clamp(20px, 5vw, 28px);
  }
  .logo {
    width: clamp(68px, 18vw, 78px);
    height: clamp(68px, 18vw, 78px);
    margin-bottom: clamp(16px, 4vw, 18px);
  }
  .title { font-size: clamp(22px, 5vw, 24px); }
  .subtitle { font-size: clamp(13px, 3.2vw, 14px); margin-bottom: clamp(18px, 4.5vw, 22px); }
  .field { margin-bottom: clamp(15px, 4vw, 18px); }
  .field label { font-size: clamp(14px, 3.5vw, 15px); }
  .field input { height: clamp(44px, 11vw, 46px); font-size: clamp(14px, 3.5vw, 15px); }
  .btn { width: min(44vw, 160px); height: clamp(44px, 11vw, 46px); font-size: clamp(18px, 4.5vw, 19px); }
}
</style>
</head>
<body>
<div class="page">
  <form class="card" id="resetForm">
    <div class="logo"><img src="/assets/Quantum%20logo-01.png" alt="Quantum logo"></div>
    <h1 class="title">Reset Password</h1>
    <p class="subtitle" id="subtitle">Enter your new password below.</p>
    <div class="field">
      <label for="password">New Password</label>
      <input id="password" type="password" placeholder="Enter new password" autocomplete="new-password" required>
    </div>
    <div class="field">
      <label for="confirmPassword">Confirm Password</label>
      <input id="confirmPassword" type="password" placeholder="Confirm new password" autocomplete="new-password" required>
    </div>
    <button class="btn" type="submit">Update</button>
    <div id="note" class="note"></div>
    <div class="links">
      <a href="/" rel="nofollow">Back to login</a>
    </div>
  </form>
</div>
<script>
const pathMatch = window.location.pathname.match(/\/reset-password\/([^/]+)/);
const params = new URLSearchParams(window.location.search);
const token = decodeURIComponent(pathMatch?.[1] || params.get('token') || '');
const note = document.getElementById('note');
const subtitle = document.getElementById('subtitle');
function setNote(text, kind) {
  note.textContent = text || '';
  note.className = 'note' + (kind ? ' ' + kind : '');
}
async function validateToken() {
  if (!token) {
    subtitle.textContent = 'Missing reset token.';
    setNote('Reset link is missing a token.', 'err');
    document.querySelector('button[type="submit"]').disabled = true;
    return;
  }
  try {
    const response = await fetch('/api/auth/reset-password/validate/' + encodeURIComponent(token));
    const data = await response.json();
    if (!response.ok || !data.ok) throw new Error(data.message || 'Reset link is invalid or expired');
    subtitle.textContent = 'Resetting password for ' + (data.email || 'your account');
  } catch (error) {
    setNote(error.message || 'Reset link is invalid or expired', 'err');
    document.querySelector('button[type="submit"]').disabled = true;
  }
}
document.getElementById('resetForm').addEventListener('submit', async (event) => {
  event.preventDefault();
  const password = document.getElementById('password').value;
  const confirmPassword = document.getElementById('confirmPassword').value;
  if (password !== confirmPassword) {
    setNote('Passwords do not match', 'err');
    return;
  }
  setNote('Updating password...', '');
  try {
    const response = await fetch('/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password, confirmPassword }),
    });
    const data = await response.json();
    if (!response.ok || !data.ok) throw new Error(data.message || 'Reset failed');
    setNote(data.message || 'Password updated successfully', 'ok');
    subtitle.textContent = 'Password updated. You can now log in again.';
  } catch (error) {
    setNote(error.message || 'Reset failed', 'err');
  }
});
validateToken();
</script>
</body>
</html>
