<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quantum Login</title>
<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
}

.login-page {
    min-height: 100vh;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 1rem;
    background: #ffffff;
    font-family: Arial, sans-serif;
}

.login-card {
    width: min(360px, 100%);
    background: #dff3ff;
    border-radius: 30px;
    padding: 34px 28px;
    text-align: center;
    box-shadow: 0 18px 35px rgba(0, 0, 0, 0.25);
}

.login-logo {
    width: 78px;
    height: 78px;
    margin: 0 auto 20px;
    background: transparent;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
}

.login-logo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

.title {
    font-size: 26px;
    color: #063047;
    margin-bottom: 8px;
}

.subtitle {
    font-size: 14px;
    color: #607d8b;
    margin-bottom: 24px;
}

.input-group {
    text-align: left;
    margin-bottom: 18px;
}

.input-group label {
    display: block;
    margin-bottom: 7px;
    font-size: 15px;
    font-weight: 600;
    color: #263238;
}

.input-group input {
    width: 100%;
    height: 46px;
    border: none;
    outline: none;
    border-radius: 14px;
    padding: 0 16px;
    font-size: 15px;
    color: #555;
    background: #ffffff;
    box-shadow: 8px 8px 12px rgba(0, 0, 0, 0.20);
}

.input-group input:focus {
    border: 2px solid #008fa3;
}

.password-wrap {
    position: relative;
}

.password-wrap input {
    padding-right: 52px;
}

.toggle-password {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 30px;
    height: 30px;
    border: none;
    background: transparent;
    color: #6b7c93;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
}

.toggle-password svg {
    width: 20px;
    height: 20px;
}

.toggle-password:hover {
    color: #2574e0;
}

.login-btn {
    width: 160px;
    height: 46px;
    border: none;
    border-radius: 13px;
    background: linear-gradient(135deg, #006b80, #00a99d);
    color: white;
    font-size: 21px;
    cursor: pointer;
    margin-top: 10px;
    box-shadow: 6px 8px 14px rgba(0, 0, 0, 0.30);
}

.login-btn:hover {
    transform: translateY(-2px);
}

.forgot {
    display: block;
    margin-top: 14px;
    color: #2574e0;
    font-size: 15px;
    text-decoration: none;
    text-align: right;
    font-weight: 700;
}

.create-executive {
    display: inline-block;
    color: #0ea5b9;
    font-size: 16px;
    font-weight: 700;
    text-decoration: none;
}

.create-executive:hover {
    text-decoration: underline;
    text-underline-offset: 3px;
}

.signup-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 24px;
    color: #7a859d;
    font-size: 15px;
    font-weight: 600;
}

.signup-row::before,
.signup-row::after {
    content: "";
    flex: 1;
    height: 1px;
    background: rgba(122, 133, 157, 0.35);
}

@media (max-width: 720px) {
    .login-page {
        padding: .75rem;
    }

    .login-card {
        width: min(92vw, 360px);
        padding: clamp(24px, 6vw, 34px) clamp(20px, 5vw, 28px);
        border-radius: clamp(24px, 6vw, 30px);
    }

    .login-logo {
        width: clamp(68px, 18vw, 78px);
        height: clamp(68px, 18vw, 78px);
        margin-bottom: clamp(16px, 4vw, 20px);
    }

    .title {
        font-size: clamp(23px, 5.2vw, 26px);
        margin-bottom: clamp(6px, 1.8vw, 8px);
    }

    .subtitle {
        font-size: clamp(13px, 3.2vw, 14px);
        margin-bottom: clamp(20px, 5vw, 24px);
    }

    .input-group {
        margin-bottom: clamp(15px, 4vw, 18px);
    }

    .input-group label {
        font-size: clamp(14px, 3.5vw, 15px);
        margin-bottom: clamp(5px, 1.5vw, 7px);
    }

    .input-group input {
        height: clamp(44px, 11vw, 46px);
        border-radius: clamp(12px, 3.2vw, 14px);
        padding: 0 clamp(14px, 4vw, 16px);
        font-size: clamp(14px, 3.5vw, 15px);
    }

    .password-wrap input {
        padding-right: clamp(46px, 11vw, 52px);
    }

    .toggle-password {
        right: 10px;
        width: 26px;
        height: 26px;
    }

    .toggle-password svg {
        width: 18px;
        height: 18px;
    }

    .login-btn {
        width: min(44vw, 160px);
        height: clamp(44px, 11vw, 46px);
        border-radius: clamp(12px, 3.2vw, 13px);
        font-size: clamp(19px, 4.8vw, 21px);
        margin-top: clamp(8px, 2vw, 10px);
    }

    .forgot {
        margin-top: clamp(14px, 3.5vw, 16px);
        font-size: clamp(13px, 3.2vw, 14px);
    }
}
</style>
</head>

<body>
<div class="login-page">
    <form class="login-card" id="loginForm" onsubmit="login(); return false;">
        <div class="login-logo">
            <img src="/assets/Quantum%20logo-01.png" alt="Quantum logo">
        </div>

        <h2 class="title">Welcome</h2>
        <p class="subtitle">Login to your account</p>

        <div class="input-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="username" required>
        </div>

        <div class="input-group">
            <label for="password">Password</label>
            <div class="password-wrap">
                <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                <button class="toggle-password" id="togglePassword" type="button" aria-label="Show password" title="Show password" onclick="toggleLoginPassword()">
                    <svg id="passwordEyeOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    <svg id="passwordEyeClosed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none">
                        <path d="M3 3l18 18"></path>
                        <path d="M10.6 10.6A3 3 0 0 0 13.4 13.4"></path>
                        <path d="M6.5 6.5C4.2 8.3 2.7 10.9 2 12c0 0 3.5 7 10 7 1.9 0 3.6-.4 5-1.1"></path>
                        <path d="M9.9 5.1A10.7 10.7 0 0 1 12 5c6.5 0 10 7 10 7a18.8 18.8 0 0 1-3.1 4.5"></path>
                    </svg>
                </button>
            </div>
        </div>

        <a href="/forgot-password" class="forgot">Forget Password</a>

        <button class="login-btn" type="submit">Login</button>

        <div class="signup-row">
            <span>Don't have an account?</span>
            <a href="/create-executive-account" class="create-executive">Sign up</a>
        </div>
    </form>
</div>
</body>
</html>
