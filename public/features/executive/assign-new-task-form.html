<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support Form</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f6fb;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.form-card{
    width:100%;
    max-width:600px;
    background:#fff;
    border-radius:12px;
    padding:25px;
    box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

.form-header{
    margin-bottom:20px;
}

.form-header h2{
    font-size:24px;
    color:#111827;
    margin-bottom:5px;
}

.form-header p{
    color:#6b7280;
    font-size:14px;
}

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;
    margin-bottom:6px;
    font-size:14px;
    font-weight:600;
    color:#374151;
}

.form-control{
    width:100%;
    height:45px;
    border:1px solid #d1d5db;
    border-radius:8px;
    padding:0 12px;
    font-size:14px;
    outline:none;
}

.form-control:focus{
    border-color:#2563eb;
}

textarea.form-control{
    height:120px;
    padding:12px;
    resize:none;
}

.submit-btn{
    width:100%;
    height:45px;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:white;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
}

.submit-btn:hover{
    background:#1d4ed8;
}
</style>
</head>
<body>

<div class="form-card">

    <div class="form-header">
        <h2 id="formTitle">Assign new data</h2>
        <!-- <p>Please provide your information and describe your issue.</p> -->
    </div>

    <form id="assignNewTaskForm">

        <div class="form-group">
            <label>Full Name</label>
            <input id="fullName" type="text" class="form-control" placeholder="Enter your full name">
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input id="email" type="email" class="form-control" placeholder="Enter your email">
        </div>

        <div class="form-group">
            <label>Phone Number</label>
            <input id="phone" type="tel" class="form-control" placeholder="Enter phone number">
        </div>
        <div class="form-group">
            <label>Advertisement</label>
            <input id="advertisement" type="text" class="form-control" placeholder="Enter advertisement">
        </div>
        

        <div class="form-group">
            <label>Problem </label>
            <textarea
                id="problem"
                class="form-control"
                placeholder="Describe your problem..."
            ></textarea>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
            Submit Problem
        </button>

    </form>

</div>

<script>
function sendHeight() {
    const height = Math.max(document.body.scrollHeight || 0, document.documentElement.scrollHeight || 0, 720);
    parent.postMessage({ type: 'crm:assign-new-task:resize', height }, window.location.origin);
}

document.getElementById('assignNewTaskForm').addEventListener('submit', function (event) {
    event.preventDefault();
    parent.postMessage({
        type: 'crm:assign-new-task:submit',
        payload: {
            full_name: document.getElementById('fullName').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
            advertisement: document.getElementById('advertisement').value,
            problem: document.getElementById('problem').value
        }
    }, window.location.origin);
});

window.addEventListener('message', function (event) {
    if (event.origin !== window.location.origin) return;
    if (event.data && event.data.type === 'crm:assign-new-task:prefill') {
        const payload = event.data.payload || {};
        document.getElementById('fullName').value = payload.full_name || '';
        document.getElementById('email').value = payload.email || '';
        document.getElementById('phone').value = payload.phone || '';
        document.getElementById('advertisement').value = payload.advertisement || '';
        document.getElementById('problem').value = payload.problem || '';
        document.getElementById('formTitle').textContent = payload.mode === 'edit' ? 'Edit task' : 'Assign new data';
        document.getElementById('submitBtn').textContent = payload.mode === 'edit' ? 'Update Task' : 'Submit Problem';
        sendHeight();
        return;
    }
    if (event.data && event.data.type === 'crm:assign-new-task:reset') {
        document.getElementById('assignNewTaskForm').reset();
        document.getElementById('formTitle').textContent = 'Assign new data';
        document.getElementById('submitBtn').textContent = 'Submit Problem';
        sendHeight();
    }
});

window.addEventListener('load', sendHeight);
window.addEventListener('resize', sendHeight);
setTimeout(sendHeight, 50);
</script>

</body>
</html>
