<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Connector Account</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f4f7fc;
    padding:20px;
}

.form-card{
    width:420px;
    background:#edf4fb;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
    border:1px solid #d9e4ef;
}

.form-header{
    padding:25px 20px;
    background:#edf4fb;
    border-bottom:1px solid #dbe6f1;
}

.form-header h3{
    color:#1f2937;
    font-size:20px;
    font-weight:700;
}

.form-body{
    padding:20px;
}

.input-group{
    margin-bottom:14px;
}

.input-group input{
    width:100%;
    height:48px;
    border:1px solid #d7e0ea;
    border-radius:8px;
    outline:none;
    background:#f9fbfd;
    padding:0 15px;
    font-size:15px;
    color:#333;
    transition:.3s;
}

.input-group input:focus{
    border-color:#2f80d8;
    box-shadow:0 0 0 3px rgba(47,128,216,0.15);
}

.input-group input::placeholder{
    color:#777;
}

.password-group{
    position:relative;
}

.password-group input{
    padding-right:45px;
}

.toggle-password{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    color:#777;
    font-size:16px;
}

.toggle-password:hover{
    color:#2f80d8;
}

.submit-btn{
    width:100%;
    height:48px;
    border:none;
    border-radius:8px;
    background:#2f7ed8;
    color:#fff;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    transition:.3s;
}

.submit-btn:hover{
    background:#1f6fc8;
}

</style>
</head>

<body>

<div class="form-card">

    <div class="form-header">
        <h3>Create New Connector Account</h3>
    </div>

    <form class="form-body">

        <div class="input-group">
            <input
                type="text"
                placeholder="Full Name"
                required
            >
        </div>

        <div class="input-group">
            <input
                type="tel"
                placeholder="Phone Number"
                required
            >
        </div>

        <div class="input-group">
            <input
                type="email"
                placeholder="Email"
                required
            >
        </div>

        <div class="input-group password-group">

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <span
                class="toggle-password"
                onclick="togglePassword('password', this)"
            >
                <i class="fa-solid fa-eye"></i>
            </span>

        </div>

        <div class="input-group password-group">

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm Password"
                required
            >

            <span
                class="toggle-password"
                onclick="togglePassword('confirmPassword', this)"
            >
                <i class="fa-solid fa-eye"></i>
            </span>

        </div>

        <button
            type="submit"
            class="submit-btn"
        >
            Create Connector Account
        </button>

    </form>

</div>

<script>

function togglePassword(inputId, element){

    const input = document.getElementById(inputId);
    const icon = element.querySelector("i");

    if(input.type === "password"){

        input.type = "text";

        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");

    }else{

        input.type = "password";

        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");

    }

}

</script>

</body>
</html>
