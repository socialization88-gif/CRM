<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
      background:#f6f8fb;
      color:#172033;
      font-family:"Segoe UI",Arial,sans-serif;
    }
    main{
      width:min(100%,520px);
      background:#fff;
      border:1px solid #d8e0eb;
      border-radius:8px;
      padding:28px;
      text-align:center;
      box-shadow:0 18px 50px rgba(15,23,42,.08);
    }
    h1{font-size:28px;margin-bottom:10px}
    p{color:#667085;line-height:1.55}
    a{
      display:inline-block;
      margin-top:20px;
      padding:10px 16px;
      border-radius:8px;
      background:#2b74cf;
      color:#fff;
      text-decoration:none;
      font-weight:800;
    }
  </style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>This published page is unavailable, inactive, or no longer exists.</p>
    <a href="/">Go home</a>
  </main>
</body>
</html>
